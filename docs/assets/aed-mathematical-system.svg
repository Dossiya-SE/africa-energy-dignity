<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Africa Energy Dignity mathematical systems architecture V3</title>
  <desc id="desc">An evidence-governed energy-systems architecture showing provenance, energy conservation and storage, geospatial demand and hazard state, resilience dynamics, constrained multiobjective design, deployment-time decomposition, and verification versus validation. Mathematical models are distinct from empirical or deployment evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#0a2832"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#79a0b5"/></marker>
    <style>
      .title{font:700 39px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f4fbfb}.sub{font:400 17px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#a7c7ca}.head{font:700 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#f3fbfb}.body{font:400 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#aec9ca}.tiny{font:500 11px ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#8aadaf}.math{font:600 17px Georgia,Times New Roman,serif;fill:#edf9f9}.math2{font:600 15px Georgia,Times New Roman,serif;fill:#e6f5f5}.card{fill:#0d2833;stroke:#356b75;stroke-width:1.5}.source{fill:#102842;stroke:#4c87aa;stroke-width:1.5}.energy{fill:#253017;stroke:#b89d42;stroke-width:1.5}.res{fill:#0e2e2a;stroke:#43a481;stroke-width:1.5}.opt{fill:#302810;stroke:#d2ad43;stroke-width:1.5}.verify{fill:#2f1c22;stroke:#d66c78;stroke-width:1.5}.flow{fill:none;stroke:#79a0b5;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#d2ad43;stroke-width:2;stroke-dasharray:7 6}.rule{stroke:#2a535c;stroke-width:1.1}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="title">Africa Energy Dignity — Evidence-Governed Energy Systems Mathematics</text>
  <text x="70" y="98" class="sub">source/provenance → energy physics → spatial demand/hazard → resilience → constrained design → deployment → measured learning</text>

  <rect x="70" y="140" width="342" height="210" rx="20" class="source"/>
  <text x="94" y="174" class="head">1 · Evidence field — [E/S]</text>
  <text x="94" y="208" class="math2">z(s,t) = {population, demand, assets,</text><text x="94" y="232" class="math2">cost, hazard, service, geography}</text>
  <text x="94" y="267" class="body">every value retains source, spatial/temporal support, units, license and evidence state</text>
  <g transform="translate(100 294)"><line x1="0" y1="32" x2="258" y2="32" stroke="#607d91"/><circle cx="38" cy="20" r="7" fill="#5ca8d8"/><circle cx="94" cy="42" r="7" fill="#4ec9b0"/><circle cx="157" cy="17" r="7" fill="#d2ad43"/><circle cx="221" cy="38" r="7" fill="#b376cf"/><text x="265" y="36" class="tiny">space/time indexed evidence</text></g>

  <rect x="438" y="140" width="342" height="210" rx="20" class="energy"/>
  <text x="462" y="174" class="head">2 · Conservation + storage — [M]</text>
  <text x="462" y="208" class="math2">Pgen + Pimport + Pdis</text><text x="462" y="232" class="math2">= Pload + Ploss + Pch + Pexport</text>
  <text x="462" y="264" class="math2">SOCₜ₊₁ = SOCₜ + ηc Ech − Edis/ηd</text>
  <text x="462" y="298" class="body">boundaries, timestep and units must be declared before optimization</text>
  <text x="462" y="326" class="tiny">energy balance is a model/accounting identity; parameter values require evidence</text>

  <rect x="806" y="140" width="342" height="210" rx="20" class="res"/>
  <text x="830" y="174" class="head">3 · Resilience dynamics — [M/C]</text>
  <text x="830" y="208" class="math">ẋ = f(x,u,η;θ)</text><text x="830" y="236" class="math">S(t) = wᵀx(t)</text>
  <g transform="translate(838 270)"><line x1="0" y1="54" x2="274" y2="54" stroke="#607d91"/><path d="M0 10 C45 12 62 53 98 51 C133 49 151 26 181 18 C215 10 245 9 274 5" fill="none" stroke="#4ec9b0" stroke-width="3.5"/><line x1="0" y1="38" x2="274" y2="38" stroke="#d66c78" stroke-width="2" stroke-dasharray="6 5"/><text x="188" y="34" class="tiny">service floor</text></g>

  <rect x="1174" y="140" width="356" height="210" rx="20" class="opt"/>
  <text x="1198" y="174" class="head">4 · Constrained multiobjective design — [M]</text>
  <text x="1198" y="208" class="math2">min [C(d), E(d), T(d), Risk(d)]</text><text x="1198" y="234" class="math2">max [Service(d), Resilience(d), Sovereignty(d)]</text>
  <text x="1198" y="269" class="body">safety · reliability · affordability · maintainability · environmental limits · local capability</text>
  <path d="M1210 323 C1270 275 1336 263 1398 271 S1491 293 1508 312" fill="none" stroke="#d2ad43" stroke-width="3.5"/><g fill="#d2ad43"><circle cx="1250" cy="294" r="5"/><circle cx="1320" cy="268" r="5"/><circle cx="1398" cy="271" r="5"/><circle cx="1470" cy="295" r="5"/></g><text x="1320" y="320" class="tiny">Pareto set only after constraints/objectives are explicit</text>

  <path d="M412 245H438M780 245H806M1148 245H1174" class="flow"/>

  <line x1="70" y1="390" x2="1530" y2="390" class="rule"/>

  <rect x="70" y="426" width="706" height="170" rx="20" class="card"/>
  <text x="94" y="460" class="head">5 · Rapid-deployment clock — [M/E]</text>
  <text x="94" y="496" class="math2">Timpact = Tdiagnosis + Tdesign + Tapproval + Tfinance + Tprocurement + Tconstruction + Tcommissioning</text>
  <g transform="translate(100 530)"><rect x="0" y="0" width="86" height="25" fill="#366784"/><rect x="86" y="0" width="82" height="25" fill="#477792"/><rect x="168" y="0" width="75" height="25" fill="#6b6791"/><rect x="243" y="0" width="72" height="25" fill="#877247"/><rect x="315" y="0" width="96" height="25" fill="#9d783b"/><rect x="411" y="0" width="111" height="25" fill="#518b77"/><rect x="522" y="0" width="76" height="25" fill="#477a70"/><text x="608" y="18" class="tiny">duration values are empirical only if sourced</text></g>

  <rect x="804" y="426" width="726" height="170" rx="20" class="verify"/>
  <text x="828" y="460" class="head">6 · Verification ≠ validation</text>
  <text x="828" y="497" class="math2">software/schema consistency → [V] implementation evidence</text>
  <text x="828" y="526" class="math2">calibration + out-of-sample/field comparison → [E] model validity evidence</text>
  <text x="828" y="558" class="body">passing CI cannot be used as evidence of continental optimization quality, investment impact, field deployment or causal productive outcomes</text>

  <rect x="70" y="632" width="1460" height="176" rx="20" class="card"/>
  <text x="94" y="666" class="head">7 · Evidence-governed engineering life cycle</text>
  <g transform="translate(102 706)">
    <rect x="0" y="0" width="150" height="54" rx="13" class="source"/><text x="75" y="24" text-anchor="middle" class="tiny">SOURCE</text><text x="75" y="41" text-anchor="middle" class="tiny">provenance</text>
    <rect x="177" y="0" width="150" height="54" rx="13" class="card"/><text x="252" y="24" text-anchor="middle" class="tiny">REQUIRE</text><text x="252" y="41" text-anchor="middle" class="tiny">needs + limits</text>
    <rect x="354" y="0" width="150" height="54" rx="13" class="energy"/><text x="429" y="24" text-anchor="middle" class="tiny">MODEL</text><text x="429" y="41" text-anchor="middle" class="tiny">physics + data</text>
    <rect x="531" y="0" width="150" height="54" rx="13" class="opt"/><text x="606" y="24" text-anchor="middle" class="tiny">OPTIMIZE</text><text x="606" y="41" text-anchor="middle" class="tiny">trade space</text>
    <rect x="708" y="0" width="150" height="54" rx="13" class="verify"/><text x="783" y="24" text-anchor="middle" class="tiny">VERIFY</text><text x="783" y="41" text-anchor="middle" class="tiny">software/model numerics</text>
    <rect x="885" y="0" width="150" height="54" rx="13" class="res"/><text x="960" y="24" text-anchor="middle" class="tiny">VALIDATE</text><text x="960" y="41" text-anchor="middle" class="tiny">real-world evidence</text>
    <rect x="1062" y="0" width="150" height="54" rx="13" class="card"/><text x="1137" y="24" text-anchor="middle" class="tiny">DEPLOY</text><text x="1137" y="41" text-anchor="middle" class="tiny">field system</text>
    <rect x="1239" y="0" width="150" height="54" rx="13" class="source"/><text x="1314" y="24" text-anchor="middle" class="tiny">LEARN</text><text x="1314" y="41" text-anchor="middle" class="tiny">monitor + revise</text>
    <path d="M150 27H177M327 27H354M504 27H531M681 27H708M858 27H885M1035 27H1062M1212 27H1239" class="flow"/>
  </g>
  <text x="94" y="790" class="tiny">Current repository maturity is strongest in provenance, schemas, geospatial/data infrastructure, software verification and governance; production optimization/deployment remains a future validation gate.</text>

  <rect x="230" y="842" width="1140" height="32" rx="12" fill="#0a1d28" stroke="#3b5f65"/>
  <text x="800" y="863" text-anchor="middle" class="tiny">Evidence state is part of every number: observed · official/published · derived · model output · expert judgment · scenario · design target · planned</text>
</svg>
