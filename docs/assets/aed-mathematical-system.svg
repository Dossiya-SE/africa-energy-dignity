<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d"><title id="t">Africa Energy Dignity mathematical systems architecture</title><desc id="d">Visual representation of evidence lineage, energy balance, spatial demand, resilience, multi-objective optimization and deployment validation.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06121e"/><stop offset="1" stop-color="#0a2634"/></linearGradient><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a4b5c" stroke-opacity=".25"/></pattern></defs><rect width="1600" height="880" rx="30" fill="url(#bg)"/><rect x="24" y="24" width="1552" height="832" rx="24" fill="url(#grid)" stroke="#255f71"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="75" fill="#effffd" font-size="32" font-weight="800">AFRICA ENERGY DIGNITY — EVIDENCE → MODEL → DEPLOYMENT</text><text x="70" y="108" fill="#9fd1d4" font-size="16">open energy-sovereignty modeling · geospatial evidence · resilient infrastructure · rapid deployment engineering</text>
