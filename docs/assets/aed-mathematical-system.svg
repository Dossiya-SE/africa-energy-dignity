ont-size="10">field system</text><circle cx="1410" cy="580" r="43" fill="#172554" stroke="#818cf8" stroke-width="3"/><text x="1410" y="576" text-anchor="middle" fill="#fff">LEARN</text><text x="1410" y="594" text-anchor="middle" fill="#c7d2fe" font-size="10">monitor/revise</text></g><text x="108" y="694" fill="#9bc9d0" font-size="14">Current repository evidence is strongest in source/provenance, data contracts, schemas, migrations, software verification and governance. Production optimization/deployment remains a future validation gate.</text></g></svg>