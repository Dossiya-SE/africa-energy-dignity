services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aed}
      POSTGRES_USER: ${POSTGRES_USER:-aed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aed}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-aed} -d ${POSTGRES_DB:-aed}
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - aed-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AED_ENV: ${AED_ENV:-development}
      AED_DATABASE_URL: ${AED_DATABASE_URL:-postgresql+psycopg://aed:aed@db:5432/aed}
      AED_DATABASE_ECHO: ${AED_DATABASE_ECHO:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      AED_API_URL: ${AED_WEB_API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:3000/ >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "3000:3000"

volumes:
  aed-postgres:
