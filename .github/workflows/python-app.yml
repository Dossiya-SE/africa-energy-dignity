# Install, validate and test the Africa Energy Dignity repository.
name: AED application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aed_test
          POSTGRES_USER: aed
          POSTGRES_PASSWORD: aed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aed -d aed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      - name: Validate repository structure
        run: python scripts/validate_repository.py
      - name: Validate canonical schemas
        run: python scripts/validate_schemas.py
      - name: Verify AED imports
        run: |
          python -c "from aed.indicators import Indicator; print('Indicator import successful')"
          python -c "from aed.api.main import app; print(app.title)"
      - name: Validate Docker Compose
        run: docker compose config
      - name: Apply migrations to PostgreSQL/PostGIS
        env:
          AED_DATABASE_URL: postgresql+psycopg://aed:aed@localhost:5432/aed_test
        run: alembic upgrade head
      - name: Test with pytest
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests alembic

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Lint AED Studio
        run: npm run lint
      - name: Type-check AED Studio
        run: npm run typecheck
      - name: Test AED Studio
        run: npm run test
      - name: Build AED Studio
        env:
          AED_API_URL: http://127.0.0.1:8000
        run: npm run build
