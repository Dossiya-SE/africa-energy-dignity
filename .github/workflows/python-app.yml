# Install, validate and test the Africa Energy Dignity repository.
name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      - name: Validate repository structure
        run: python scripts/validate_repository.py
      - name: Validate canonical schemas
        run: python scripts/validate_schemas.py
      - name: Verify AED imports
        run: |
          python -c "from aed.indicators import Indicator; print('Indicator import successful')"
          python -c "from aed.api.main import app; print(app.title)"
      - name: Validate Docker Compose
        run: docker compose config
      - name: Test with pytest
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests alembic
