# Install, validate and test the Africa Energy Dignity repository.
name: AED application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aed_test
          POSTGRES_USER: aed
          POSTGRES_PASSWORD: aed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aed -d aed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      - name: Validate repository structure
        run: python scripts/validate_repository.py
      - name: Validate canonical schemas
        run: python scripts/validate_schemas.py
      - name: Validate canonical geospatial evidence
        run: python scripts/validate_geospatial.py
      - name: Verify AED imports
        run: |
          python -c "from aed.indicators import Indicator; print('Indicator import successful')"
          python -c "from aed.api.main import app; print(app.title)"
      - name: Validate Docker Compose
        run: docker compose config
      - name: Apply migrations to PostgreSQL/PostGIS
        env:
          AED_DATABASE_URL: postgresql+psycopg://aed:aed@localhost:5432/aed_test
        run: alembic upgrade head
      - name: Test with pytest
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests alembic

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Lint AED Studio
        run: npm run lint
      - name: Type-check AED Studio
        run: npm run typecheck
      - name: Test AED Studio
        run: npm run test
      - name: Build AED Studio
        env:
          AED_API_URL: http://127.0.0.1:8000
        run: npm run build

  worldpop-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'geo/burkina-verified-evidence'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://data.worldpop.org/GIS/Population/Global_2000_2020_1km/2020/BFA/bfa_ppp_2020_1km_Aggregated.tif
      RELEASE_TAG: geo-002-worldpop-bfa-2020-v1
      RAW_NAME: bfa_ppp_2020_1km_Aggregated.tif
      COG_NAME: bfa_ppp_2020_1km_Aggregated.cog.tif
      PREVIEW_NAME: bfa_ppp_2020_1km_Aggregated.preview.png
      MANIFEST_NAME: bfa_ppp_2020_1km_Aggregated.manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned geospatial tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.2.6 \
            Pillow==11.3.0 \
            rasterio==1.4.3 \
            rio-cogeo==5.4.2 \
            shapely==2.1.1

      - name: Apply audited WorldPop coverage gate
        run: python scripts/patch_worldpop_coverage_gate.py

      - name: Download, inspect, validate and transform WorldPop
        run: |
          python scripts/worldpop_pipeline.py prepare \
            --source-url "$SOURCE_URL" \
            --boundary data/canonical/boundaries/bfa-natural-earth-5.1.1.geojson \
            --work-root .evidence \
            --release-tag "$RELEASE_TAG"

      - name: Preserve immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAW=".evidence/raw/$RAW_NAME"
          COG=".evidence/canonical/$COG_NAME"
          PREVIEW=".evidence/preview/$PREVIEW_NAME"
          MANIFEST=".evidence/$MANIFEST_NAME"
          mkdir -p .evidence/existing data/manifests web/public/evidence

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > .evidence/existing-assets.txt
            for required in "$RAW_NAME" "$COG_NAME" "$PREVIEW_NAME" "$MANIFEST_NAME"; do
              grep -Fx "$required" .evidence/existing-assets.txt >/dev/null || {
                echo "Existing release is incomplete: missing $required" >&2
                exit 1
              }
            done
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$MANIFEST_NAME" --dir .evidence/existing
            python scripts/worldpop_pipeline.py compare \
              --expected ".evidence/existing/$MANIFEST_NAME" \
              --actual "$MANIFEST"
            cp ".evidence/existing/$MANIFEST_NAME" "data/manifests/$MANIFEST_NAME"
          else
            python scripts/worldpop_release_notes.py
            gh release create "$RELEASE_TAG" \
              "$RAW" "$COG" "$PREVIEW" "$MANIFEST" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "GEO-002 WorldPop Burkina Faso 2020 evidence archive" \
              --notes-file .evidence/release-notes.md \
              --prerelease
            cp "$MANIFEST" "data/manifests/$MANIFEST_NAME"
          fi

          cp "$PREVIEW" "web/public/evidence/$PREVIEW_NAME"

      - name: Commit manifest and small map derivative
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/worldpop_pipeline.py \
            "data/manifests/$MANIFEST_NAME" \
            "web/public/evidence/$PREVIEW_NAME"
          if git diff --cached --quiet; then
            echo "Manifest, pipeline and preview already match the preserved release."
          else
            git commit -m "Record verified WorldPop raster evidence"
            git push origin HEAD:geo/burkina-verified-evidence
          fi

      - name: Retain processing bundle for audit
        uses: actions/upload-artifact@v4
        with:
          name: geo-002-worldpop-bfa-2020
          path: |
            .evidence/raw/${{ env.RAW_NAME }}
            .evidence/canonical/${{ env.COG_NAME }}
            .evidence/preview/${{ env.PREVIEW_NAME }}
            .evidence/${{ env.MANIFEST_NAME }}
          retention-days: 90
          if-no-files-found: error
