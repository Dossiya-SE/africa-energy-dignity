[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "africa-energy-dignity"
version = "0.1.0"
description = "Open energy sovereignty modeling and rapid deployment engineering for Sub-Saharan Africa"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Dossiya Dakou"}
]
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "numpy>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
    "rasterio>=1.4,<2",
    "shapely>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "flake8>=7,<8",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
